[project]
name = "fairgenai"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate==0.33.0",
    # 0.32.2 supports SD 3.5 Medium and still works with transformers 4.44 (huggingface-hub < 1.0)
    "diffusers==0.32.2",
    "einops==0.8.0",
    "flask==3.0.3",
    "flask-cors==4.0.1",
    "llama-index==0.10.64",
    "llama-index-llms-ollama==0.2.2",
    "pillow==10.4.0",
    "protobuf==5.29.3",
    "sentencepiece==0.2.0",
    "torch==2.4.0",
    "torchvision==0.19.0",
    "transformers==4.44.0",
]

[tool.uv]
# Day after the diffusers 0.32.2 release (2025-01-15); all other packages stay pinned as before
exclude-newer = "2025-01-16T00:00:00Z"
